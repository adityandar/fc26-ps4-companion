<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FC26 PS4 Companion</title><link rel="stylesheet" href="/styles.css"></head>
  <body><main class="shell"><header><p class="eyebrow">FC26 · PS4 CAREER ARCHIVE</p><h1>Compare your career snapshots.</h1><p class="lede">Immutable save imports, readable squad history, and live comparisons across seasons.</p></header>
    <section class="controls"><label>Career<select id="career"></select></label><label>Snapshot A<select id="snapshot-a"></select></label><label>Snapshot B<select id="snapshot-b"></select></label><button id="view">View snapshot</button><button id="compare">Compare</button></section>
    <section class="importer"><h2>Import a PS4 snapshot</h2><p class="muted">The original file stays untouched. Preview is separate from commit.</p><div class="upload-row"><input id="save-file" type="file"><button id="preview-button">Preview save</button></div><div id="preview" class="muted"></div><div id="metadata" class="upload-row" hidden><select id="career-choice"><option value="new">Create new Career</option></select><input id="career-label" placeholder="Career name"><input id="season" placeholder="Season, e.g. 2026/27"><select id="checkpoint"><option value="season_start">Season start</option><option value="summer_window_closed">Summer window closed</option><option value="january_window_closed">January window closed</option><option value="season_end">Season end</option><option value="custom">Custom</option></select><button id="import">Commit snapshot</button></div></section>
    <section id="status" class="status">Loading archive…</section><section id="result" class="result" hidden></section>
  </main><script type="module" src="/app.js"></script></body>
</html>
